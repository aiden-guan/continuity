<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="580" viewBox="0 0 1280 580" role="img" aria-labelledby="title desc">
<title id="title">Continuity — Agents forget. The thread doesn’t.</title><desc id="desc">Conceptual workflow: Agent A sends an RFQ. Mail continues arriving, Continuity updates task state, and a fresh Agent B reads a briefing. This is an architecture illustration, not a product screenshot.</desc>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1280" height="580" rx="24" fill="#f3f2ee" />
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#d74718" stroke-width="1.5"/></marker></defs><g transform="translate(54 45) scale(30)"><path fill="#161513" d="M.975.975L.025.975A.95.95 0 0 1 .975.025ZM1.025.593L1.025.025A.568.568 0 0 1 1.593.593ZM1.2611.643L1.593.643A.332.332 0 0 1 1.2611.975ZM1.2111.7889L1.2111.975A.1861.1861 0 0 1 1.025.7889Z"/><path fill="#d74718" d="M1.1209.7389L1.025.7389A.0959.0959 0 0 1 1.1209.643Z"/></g><text x="116" y="72" font-size="30" fill="#161513" font-weight="600">Continuity</text><text x="982" y="70" font-size="18" fill="#6c665f" letter-spacing="2" font-weight="600">OPEN SOURCE / MIT</text><text x="54" y="163" font-size="70" fill="#161513" font-weight="600" letter-spacing="-3">Agents forget.</text><text x="54" y="241" font-size="70" fill="#161513" font-weight="600" letter-spacing="-3">The thread doesn’t.</text><text x="57" y="293" font-size="27" fill="#6c665f" >Evidence, terms and open loops — ready for the next agent.</text><line x1="55" y1="343" x2="1225" y2="343" stroke="#d9d5cc" /><rect x="55" y="387" width="235" height="106" rx="12" fill="#fbfaf7" /><text x="73" y="426" font-size="23" fill="#161513" font-weight="600">Agent A</text><text x="73" y="460" font-size="18" fill="#6c665f" >Sends the RFQ</text><line x1="296" y1="439" x2="331" y2="439" stroke="#d74718" stroke-width="2" marker-end="url(#arrow)"/><rect x="339" y="387" width="258" height="106" rx="12" fill="#fbfaf7" /><text x="357" y="426" font-size="23" fill="#161513" font-weight="600">Mail keeps arriving</text><text x="357" y="460" font-size="18" fill="#6c665f" >Corrections · approvals</text><line x1="603" y1="439" x2="638" y2="439" stroke="#d74718" stroke-width="2" marker-end="url(#arrow)"/><rect x="646" y="387" width="282" height="106" rx="12" fill="#161513" /><text x="664" y="426" font-size="23" fill="#f3f2ee" font-weight="600">State keeps evolving</text><text x="664" y="460" font-size="18" fill="#c9c3b9" >Terms · evidence · obligations</text><line x1="934" y1="439" x2="969" y2="439" stroke="#d74718" stroke-width="2" marker-end="url(#arrow)"/><rect x="977" y="387" width="248" height="106" rx="12" fill="#fbfaf7" /><text x="995" y="426" font-size="23" fill="#161513" font-weight="600">Fresh Agent B</text><text x="995" y="460" font-size="18" fill="#6c665f" >Reads one briefing</text><circle cx="69" cy="535" r="5" fill="#d74718"/><text x="85" y="542" font-size="22" fill="#6c665f" >The conversation owns the state. The agent can be replaced.</text>
</g></svg>
