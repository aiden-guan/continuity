.7509727626459" y2="580" stroke="#e6e2d9" /><text x="611.7509727626459" y="617" font-size="21" fill="#6c665f" text-anchor="middle">150</text><line x1="780.2334630350194" y1="250" x2="780.2334630350194" y2="580" stroke="#e6e2d9" /><text x="780.2334630350194" y="617" font-size="21" fill="#6c665f" text-anchor="middle">200</text><line x1="1006" y1="250" x2="1006" y2="580" stroke="#e6e2d9" /><text x="1006" y="617" font-size="21" fill="#6c665f" text-anchor="middle">267</text><text x="573" y="657" font-size="22" fill="#6c665f" text-anchor="middle">Messages in the conversation</text><polyline points="140,539.0261325117992 163.5875486381323,506.32877456636584 230.9805447470817,448.9675841855078 352.28793774319064,396.153158982632 567.9455252918287,336.3845591074676 1006,271.1722299175279" fill="none" stroke="#8a847b" stroke-width="4" stroke-linejoin="round"/><circle cx="140" cy="539.0261325117992" r="5" fill="#8a847b"/><circle cx="163.5875486381323" cy="506.32877456636584" r="5" fill="#8a847b"/><circle cx="230.9805447470817" cy="448.9675841855078" r="5" fill="#8a847b"/><circle cx="352.28793774319064" cy="396.153158982632" r="5" fill="#8a847b"/><circle cx="567.9455252918287" cy="336.3845591074676" r="5" fill="#8a847b"/><circle cx="1006" cy="271.1722299175279" r="5" fill="#8a847b"/><polyline points="140,555.5613313009542 163.5875486381323,553.1449577725402 230.9805447470817,549.6931365153534 352.28793774319064,543.7550527590033 567.9455252918287,541.0942330297219 1006,538.4148121790079" fill="none" stroke="#d74718" stroke-width="4" stroke-linejoin="round"/><circle cx="140" cy="555.5613313009542" r="5" fill="#d74718"/><circle cx="163.5875486381323" cy="553.1449577725402" r="5" fill="#d74718"/><circle cx="230.9805447470817" cy="549.6931365153534" r="5" fill="#d74718"/><circle cx="352.28793774319064" cy="543.7550527590033" r="5" fill="#d74718"/><circle cx="567.9455252918287" cy="541.0942330297219" r="5" fill="#d74718"/><circle cx="1006" cy="538.4148121790079" r="5" fill="#d74718"