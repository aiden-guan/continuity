<title id="title">Context growth: quoted transcript versus compiled briefing</title><desc id="desc">Logarithmic token-estimate chart over six deterministic histories. At 267 messages the quoted transcript is about 2.77 million tokens and the briefing is about 1,596. Source: eval/results/scale.json; numeric values also appear in the README.</desc>
